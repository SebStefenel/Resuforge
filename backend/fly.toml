# Generated for the ResuForge compile backend. Rename `app` before first
# deploy if this name is taken (fly launch will offer to do this for you).
app = "resuforge-backend"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
